<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprovação SEEDF</title><style>body{font:16px system-ui;background:#eef3f8;color:#14243a;margin:0}header{background:#12345a;color:white;padding:24px}main{max-width:950px;margin:auto;padding:20px}button,select,input,textarea{font:inherit;padding:10px;margin:4px;border:1px solid #b6c6d6;border-radius:8px}button{background:#fff;cursor:pointer}button:hover{background:#dceaff}article{background:white;padding:22px;border-radius:14px;margin:12px 0}small{color:#52677b}progress{width:100%}textarea{width:90%} @media print{header,nav,button,select,input{display:none}}</style><header><h1>Aprovação SEEDF • Monitor</h1>Aprender fazendo — preparação Quadrix</header><main><nav id="nav"></nav><div id="app">Carregando...</div></main><script type="module">
const [rows,lessons]=await Promise.all(['roteiro.json','aulas.json'].map(x=>fetch(x).then(r=>r.json())));const app=document.querySelector('#app'),nav=document.querySelector('#nav');let state;try{state=JSON.parse(localStorage.getItem('seedf-v1'))||{done:{},answers:{},errors:[],reviews:{},notes:''}}catch{state={done:{},answers:{},errors:[],reviews:{},notes:''}};const save=()=>localStorage.setItem('seedf-v1',JSON.stringify(state));const el=(tag,t,parent=app)=>{const e=document.createElement(tag);e.textContent=t;parent.append(e);return e};const btn=(t,f,p=app)=>{const e=el('button',t,p);e.onclick=f;return e};const clear=()=>app.replaceChildren();const subjects=[...new Set(rows.map(r=>r.subject))];function home(){clear();el('h2','Estudo de hoje');el('p','30 min teoria • 30 min prática guiada • 90 min questões • 20 min correção • 10 min revisão');el('p',Object.keys(state.done).length+' etapas marcadas de '+rows.length+' importadas');let p=el('progress','');p.max=rows.length;p.value=Object.keys(state.done).length;let next=rows.find(r=>!state.done[r.id]);if(next)el('p','Próxima etapa: '+next.id+' — '+next.title);el('p','Curso inicial: '+lessons.length+' aulas autorais. Roteiro importado parcialmente; não equivale ao edital oficial.');btn('Começar prática',()=>study(0));btn('Revisões pendentes',reviews)}
function roadmap(){clear();el('h2','Roteiro de estudo');let s=el('select','');['Todas',...subjects].forEach(v=>{let o=el('option',v,s);o.value=v});let list=el('section','');function draw(){list.replaceChildren();rows.filter(r=>s.value==='Todas'||r.subject===s.value).forEach(r=>{let a=el('article','',list);let c=el('input','',a);c.type='checkbox';c.checked=!!state.done[r.id];c.onchange=()=>{if(c.checked)state.done[r.id]=true;else delete state.done[r.id];save()};el('strong',r.id+' • '+r.subject+' • '+r.title,a);el('p',r.type+' | '+r.priority,a)})}s.onchange=draw;draw()}
function study(i=0){clear();let s=el('select','');lessons.forEach((l,j)=>{let o=el('option',l[0]+' — '+l[1],s);o.value=j});s.value=i;s.onchange=()=>study(+s.value);let l=lessons[i],a=el('article','');el('h2',l[1],a);el('h3','1. Entenda a regra',a);el('p',l[2],a);el('h3','2. Exemplo resolvido',a);el('p',l[3],a);el('h3','3. Julgue os itens',a);let correct=0,answered=0;let score=el('p','0/'+l[4].length,a);l[4].forEach((q,j)=>{let box=el('article','',a);el('p',q[0],box);let feedback=el('p','',box);let buttons=[];for(let v of [true,false])buttons.push(btn(v?'Certo':'Errado',()=>{buttons.forEach(b=>b.disabled=true);answered++;if(v===q[1])correct++;else state.errors.push({lesson:i,question:q[0],explanation:q[2]});state.answers[i+'-'+j]=v===q[1];feedback.textContent=(v===q[1]?'Acertou! ':'Errou! ')+q[2];score.textContent=correct+'/'+answered+' acertos';if(answered===l[4].length){state.reviews[i]=Date.now()+86400000;el('p',correct/answered>=.9?'Meta atingida nesta amostra.':'Revise a regra e tente novamente.',a)}save()},box))});btn('Refazer',()=>study(i));if(i+1<lessons.length)btn('Próxima aula',()=>study(i+1))}
function errors(){clear();el('h2','Caderno de erros');state.errors.forEach(e=>{let a=el('article','');el('p',e.question,a);el('p',e.explanation,a);btn('Reestudar',()=>study(e.lesson),a)});if(!state.errors.length)el('p','Nenhum erro registrado.')}
function reviews(){clear();el('h2','Revisões');Object.entries(state.reviews).forEach(([i,d])=>{let a=el('article','');el('p',lessons[i][1]+' — '+new Date(d).toLocaleDateString('pt-BR'),a);btn('Revisar',()=>study(+i),a)});el('p','Revisão sugerida: 1, 7, 21 e 30 dias; o sistema registra a próxima revisão de 1 dia.')}
function flash(){clear();el('h2','Flashcards imprimíveis');lessons.forEach(l=>{let a=el('article','');el('h3',l[1],a);let d=el('details','',a);el('summary','Revelar regra',d);el('p',l[2],d);el('p',l[3],d)});btn('Imprimir',()=>{document.querySelectorAll('details').forEach(d=>d.open=true);print()})}
function writing(){clear();el('h2','Redação — prática');el('p','Tema: desafios da inclusão escolar. Apresente tese, dois argumentos e conclusão. Confira as regras do edital antes da prova.');let t=el('textarea','');t.rows=16;t.value=state.notes;t.oninput=()=>{state.notes=t.value;save()};el('p','Autocorreção: tese clara? argumentos pertinentes? coesão? norma-padrão?');}
[['Hoje',home],['Roteiro',roadmap],['Aulas e questões',()=>study(0)],['Erros',errors],['Revisões',reviews],['Flashcards',flash],['Redação',writing]].forEach(([t,f])=>btn(t,f,nav));home();
</script></html>
