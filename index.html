<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprovação SEEDF</title><style>body{font:16px system-ui;background:#eef3f8;color:#14243a;margin:0}header{background:#12345a;color:white;padding:24px}main{max-width:950px;margin:auto;padding:20px}button,select,input,textarea{font:inherit;padding:10px;margin:4px;border:1px solid #b6c6d6;border-radius:8px}button{background:#fff;cursor:pointer}button:hover{background:#dceaff}article{background:white;padding:22px;border-radius:14px;margin:12px 0}small{color:#52677b}progress{width:100%}textarea{width:90%} @media print{header,nav,button,select,input{display:none}}.question-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;border:1px solid #dce4ed}.solution-panel{background:#f1f6fc;padding:16px;border-radius:10px}.solution-panel details{padding:10px 0;border-bottom:1px solid #dce4ed}.solution-panel summary{cursor:pointer;font-weight:600}.feedback{font-weight:700}@media(max-width:700px){.question-grid{grid-template-columns:1fr}}*{box-sizing:border-box}body{font:16px/1.55 system-ui;background:#f5f7fb;color:#23334b}header{padding:22px 32px;background:#142e4c}header h1{font-size:24px;margin:0}main{max-width:1440px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;padding:28px;margin:auto}nav{background:white;border:1px solid #e1e7ef;border-radius:14px;padding:14px;align-self:start;position:sticky;top:20px}nav button{display:block;width:100%;text-align:left;border:0;margin:3px 0;padding:11px 13px;color:#304763;background:transparent}nav button:hover,nav button.active{background:#e8f0fc;color:#174b91}#app{min-width:0}article{border:1px solid #e0e6ef;box-shadow:0 3px 12px #20385008}h2{font-size:26px;margin:0 0 16px}h3{font-size:19px}progress{accent-color:#18805c;height:14px} .course-grid,.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.course-grid article,.metrics article{margin:0}.primary{background:#1957a6;color:white;border:0;padding:12px 20px}.primary:hover{background:#164781}.hero{background:#17395d;color:white;padding:26px;border-radius:16px;margin-bottom:22px}.hero h2{margin:0}.muted{color:#64748b}.metric{font-size:28px;font-weight:700;display:block}button:disabled{opacity:.6} @media(max-width:760px){main{display:block;padding:14px}nav{position:static;margin-bottom:18px;display:flex;flex-wrap:wrap}nav button{width:auto}header{padding:16px}.course-grid,.metrics{grid-template-columns:1fr}}@media print{main{display:block}nav{display:none}}.official-question{padding:26px;line-height:1.7}.question-heading{background:#edf1f6;padding:12px;font-weight:600;margin-bottom:12px}.official-question .statement{margin:32px 0}.official-question label{display:flex;align-items:center;gap:12px;margin:14px 0;padding:8px}.official-question input[type=radio]{accent-color:#1957a6;width:20px;height:20px}.question-tools{border-top:1px solid #dce4ed;margin-top:24px;padding-top:12px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}.official-question hr{border:0;border-top:1px solid #dce4ed;margin:18px 0}</style><header><h1>Aprovação | Central de Concursos</h1>Seu ambiente de aprendizagem</header><main><nav id="nav"></nav><div id="app">Carregando...</div></main><script type="module">
const [rows,lessons,radar]=await Promise.all(['roteiro.json','aulas.json','radar.json'].map(x=>fetch(x).then(r=>r.json())));const app=document.querySelector('#app'),nav=document.querySelector('#nav');let state;try{state=JSON.parse(localStorage.getItem('seedf-v1'))||{done:{},answers:{},errors:[],reviews:{},notes:''}}catch{state={done:{},answers:{},errors:[],reviews:{},notes:''}};state.first=state.first||{};const save=()=>localStorage.setItem('seedf-v1',JSON.stringify(state));const el=(tag,t,parent=app)=>{const e=document.createElement(tag);e.textContent=t;parent.append(e);return e};const btn=(t,f,p=app)=>{const e=el('button',t,p);e.onclick=f;return e};const clear=()=>app.replaceChildren();const subjects=[...new Set(rows.map(r=>r.subject))];function home(){clear();let attempts=Object.values(state.first),solo=attempts.filter(x=>!x.assisted),pct=solo.length?100*solo.filter(x=>x.correct).length/solo.length:0;el('h2','Meu desempenho');el('p','Primeiras respostas: '+attempts.length+' | Acertos sem consulta: '+(solo.length?pct.toFixed(1)+'%':'sem dados')+' | Meta: acima de 90%');let bar=el('progress','');bar.max=100;bar.value=pct;let recent=solo.slice(-20),older=solo.slice(-40,-20);if(older.length===20&&recent.length===20)el('p','Evolução: '+(100*(recent.filter(x=>x.correct).length-older.filter(x=>x.correct).length)/20).toFixed(1)+' pontos percentuais nos últimos 20 itens');else el('p','Evolução comparativa disponível após 40 respostas sem consulta.');el('h2','Radar de concursos — DF e entorno');el('small','Levantamento inicial de '+radar.date+'; distâncias rodoviárias ainda não verificadas.');radar.items.forEach(x=>{let a=el('article','');el('strong',x.name,a);el('p',x.status+' | Banca: '+x.board+' | Vagas: '+x.vacancies+' | Salário: '+x.salary,a);let link=el('a','Conferir fonte',a);link.href=x.url;link.target='_blank';link.rel='noopener noreferrer'});el('h2','Estudo de hoje');el('p','30 min teoria • 30 min prática guiada • 90 min questões • 20 min correção • 10 min revisão');el('p',Object.keys(state.done).length+' etapas marcadas de '+rows.length+' importadas');let p=el('progress','');p.max=rows.length;p.value=Object.keys(state.done).length;let next=rows.find(r=>!state.done[r.id]);if(next)el('p','Próxima etapa: '+next.id+' — '+next.title);el('p','Curso inicial: '+lessons.length+' aulas autorais. Roteiro importado parcialmente; não equivale ao edital oficial.');btn('Simulado de sábado',()=>exam());btn('Revisão inteligente',smartReview);btn('Resolver provas reais Quadrix',realBank);btn('Começar prática de fixação',()=>study(0));btn('Revisões pendentes',reviews)}
function roadmap(){clear();el('h2','Roteiro de estudo');let s=el('select','');['Todas',...subjects].forEach(v=>{let o=el('option',v,s);o.value=v});let list=el('section','');function draw(){list.replaceChildren();rows.filter(r=>s.value==='Todas'||r.subject===s.value).forEach(r=>{let a=el('article','',list);let c=el('input','',a);c.type='checkbox';c.checked=!!state.done[r.id];c.onchange=()=>{if(c.checked)state.done[r.id]=true;else delete state.done[r.id];save()};el('strong',r.id+' • '+r.subject+' • '+r.title,a);el('p',r.type+' | '+r.priority,a)})}s.onchange=draw;draw()}
function study(i=0){state.visited[i]=true;save();clear();let s=el('select','');lessons.forEach((l,j)=>{let o=el('option',l[0]+' — '+l[1],s);o.value=j});s.value=i;s.onchange=()=>study(+s.value);let l=lessons[i],a=el('article','');el('h2',l[1],a);el('h3','1. Entenda a regra',a);el('p',l[2],a);el('h3','2. Exemplo resolvido',a);el('p',l[3],a);el('h3','3. Questões de concursos anteriores',a);el('p','Pratique com enunciados originais e gabaritos conferidos. Exercícios autorais foram retirados desta aula.',a);btn('Resolver questões oficiais Quadrix',()=>realBank(l[0]),a).className='primary';if(i+1<lessons.length)btn('Próxima aula',()=>study(i+1),a)} 
function errors(){clear();el('h2','Caderno de erros');state.errors.forEach(e=>{let a=el('article','');el('p',e.question,a);el('p',e.explanation,a);btn('Reestudar',()=>study(e.lesson),a)});if(!state.errors.length)el('p','Nenhum erro registrado.')}
function reviews(){clear();el('h2','Revisões');Object.entries(state.reviews).forEach(([i,d])=>{let a=el('article','');el('p',lessons[i][1]+' — '+new Date(d).toLocaleDateString('pt-BR'),a);btn('Revisar',()=>study(+i),a)});el('p','Revisão sugerida: 1, 7, 21 e 30 dias; o sistema registra a próxima revisão de 1 dia.')}
function flash(){clear();el('h2','Flashcards imprimíveis');lessons.forEach(l=>{let a=el('article','');el('h3',l[1],a);let d=el('details','',a);el('summary','Revelar regra',d);el('p',l[2],d);el('p',l[3],d)});btn('Imprimir',()=>{document.querySelectorAll('details').forEach(d=>d.open=true);print()})}
function writing(){clear();el('h2','Redação — prática');el('p','Tema: desafios da inclusão escolar. Apresente tese, dois argumentos e conclusão. Confira as regras do edital antes da prova.');let t=el('textarea','');t.rows=16;t.value=state.notes;t.oninput=()=>{state.notes=t.value;save()};el('p','Autocorreção: tese clara? argumentos pertinentes? coesão? norma-padrão?');}
function bank(){clear();el('h2','Minhas questões');let controls=el('article','');let search=el('input','',controls);search.placeholder='Palavra-chave';let selectors={};for(let [k,values] of Object.entries({'Situação':['Todas','Resolvidas','Não resolvidas','Acertei','Errei'],'Disciplina':['Todas',...new Set(lessons.map(l=>l[0]))],'Assunto':['Todos',...lessons.map(l=>l[1])],'Banca':['Todas','Autoral — estilo Quadrix'],'Instituição':['Todas','Não aplicável'],'Ano':['Todos','Não aplicável'],'Cargo':['Todos','Monitor — preparação'],'Nível':['Todos','Não classificado'],'Área de formação':['Todas','Não aplicável'],'Área de atuação':['Todas','Educação — preparação'],'Modalidade':['Todas','Certo ou errado'],'Dificuldade':['Todas','Não classificada']})){let label=el('label',k+' ',controls);let s=el('select','',label);selectors[k]=s;values.forEach(v=>{let o=el('option',v,s);o.value=v});s.onchange=draw}let list=el('section','');function draw(){list.replaceChildren();let n=0;lessons.forEach((l,i)=>{if(selectors.Disciplina.selectedIndex&&selectors.Disciplina.value!==l[0]||selectors.Assunto.selectedIndex&&selectors.Assunto.value!==l[1])return;l[4].forEach((q,j)=>{let p=state.first[i+'-'+j],status=selectors.Situação.value;if(status==='Resolvidas'&&!p||status==='Não resolvidas'&&p||status==='Acertei'&&!p?.correct||status==='Errei'&&(!p||p.correct))return;if(![l[0],l[1],q[0]].join(' ').toLowerCase().includes(search.value.toLowerCase()))return;n++;let a=el('article','',list);el('small',l[0]+' • '+l[1]+' • Autoral',a);el('p',q[0],a);btn('Abrir aula e resolver',()=>study(i),a)})});el('p',n+' questões encontradas',list)}search.oninput=draw;draw()} function official(){clear();el('h2','Provas reais Quadrix');el('p','Provas de outros cargos da SEEDF para treino complementar. Os itens internos são autorais, não oficiais.');[["SEDF 2025 — Professor de Português","https://www.qconcursos.com/questoes-de-concursos/provas/quadrix-2025-sedf-professor-de-educacao-basica-lingua-portuguesa"],["SEDF 2022 — Gestor Administração","https://www.qconcursos.com/questoes-de-concursos/provas/quadrix-2022-sedf-gestor-administracao"],["SEDF 2022 — Professor de Português","https://elite.qconcursos.com/questoes-de-concursos/provas/quadrix-2022-sedf-professor-de-educacao-basica-lingua-portuguesa-edital-n-31"],["SEDF 2022 — Orientador Educacional","https://elite.qconcursos.com/questoes-de-concursos/provas/quadrix-2022-sedf-pedagogo-orientador-educacional-edital-n-31"]].forEach(([name,url])=>{let a=el('article','');let link=el('a',name,a);link.href=url;link.target='_blank';link.rel='noopener noreferrer'});}
state.exams=state.exams||{};state.visited=state.visited||{};state.reviewLog=state.reviewLog||{};
function studied(i){return state.visited[i]||Object.keys(state.first).some(k=>k.startsWith(i+'-'))}
function stats(i){let p=Object.entries(state.first).filter(([k,v])=>k.startsWith(i+'-')&&!v.assisted).map(([,v])=>v.correct);for(let e of Object.values(state.exams))if(e.finished)for(let [k,v] of Object.entries(e.answers))if(k.startsWith(i+'-'))p.push(v===lessons[i][4][+k.split('-')[1]][1]);return {n:p.length,rate:p.length?p.filter(Boolean).length/p.length:0}}
function saturday(){let d=new Date();d.setDate(d.getDate()+(6-d.getDay()+7)%7);return d.toLocaleDateString('pt-BR')}
function exam(key=saturday()){clear();el('h2','Simulado de sábado — '+key);el('p','Simulado de fixação autoral — não é prova oficial. Para provas reais, consulte a aba Questões reais Quadrix. Meta superior a 90%.');let e=state.exams[key];if(!e){let pool=[];lessons.forEach((l,i)=>{if(studied(i))l[4].forEach((q,j)=>pool.push({k:i+'-'+j,i,seen:!!state.first[i+'-'+j]}))});pool.sort((a,b)=>Number(a.seen)-Number(b.seen)||stats(a.i).rate-stats(b.i).rate);el('p',pool.length+' questões disponíveis; itens anteriores podem se repetir.');if(!pool.length){btn('Estudar primeiro',()=>study(0));return}btn('Iniciar',()=>{state.exams[key]={keys:pool.slice(0,40).map(x=>x.k),answers:{},finished:false};save();exam(key)});return}let n=e.keys.length,count=Object.keys(e.answers).length;el('p',count+'/'+n+' respondidas');let bar=el('progress','');bar.max=n;bar.value=count;if(e.finished){let c=e.keys.filter(k=>{let [i,j]=k.split('-').map(Number);return e.answers[k]===lessons[i][4][j][1]}).length;el('h3','Resultado: '+c+'/'+n+' — '+(100*c/n).toFixed(1)+'%');btn('Revisar dificuldades',smartReview)}e.keys.forEach((k,idx)=>{let [i,j]=k.split('-').map(Number),q=lessons[i][4][j],a=el('article','');el('small',lessons[i][1],a);el('p',(idx+1)+'. '+q[0],a);for(let v of [true,false]){let b=btn(v?'Certo':'Errado',()=>{if(e.finished||Object.hasOwn(e.answers,k))return;e.answers[k]=v;save();exam(key)},a);b.disabled=e.finished||Object.hasOwn(e.answers,k)}if(Object.hasOwn(e.answers,k))el('p','Resposta registrada: '+(e.answers[k]?'Certo':'Errado'),a);if(e.finished){el('p','Gabarito: '+(q[1]?'Certo':'Errado')+' — '+q[2],a);el('p','Como resolver: '+(q[3]||lessons[i][2]),a)}});if(!e.finished)btn('Finalizar',()=>{if(count<n&&!confirm('Finalizar com itens em branco?'))return;e.finished=true;save();exam(key)})}
function examHistory(){clear();el('h2','Simulados semanais');btn('Simulado de sábado',()=>exam());Object.keys(state.exams).forEach(k=>btn(k,()=>exam(k)))}
function smartReview(){clear();el('h2','Revisão inteligente');el('p','Prioridade: menor aproveitamento sem consulta.');lessons.map((l,i)=>({l,i,...stats(i)})).filter(x=>studied(x.i)).sort((a,b)=>a.rate-b.rate).forEach(x=>{let a=el('article','');el('h3',x.l[1],a);el('p',x.n?(100*x.rate).toFixed(1)+'% em '+x.n+' respostas':'Sem dados',a);el('p',x.n<10?'Amostra insuficiente':x.rate<=.9?'Prioridade de revisão':'Acima da meta',a);let log=state.reviewLog[x.i];if(log)el('p','Próxima revisão: '+new Date(log.due).toLocaleDateString('pt-BR'),a);let d=el('details','',a);el('summary','Revisar regra e exemplo',d);el('p',x.l[2],d);el('p',x.l[3],d);btn('Praticar',()=>study(x.i),a);btn('Registrar revisão',()=>{let step=Math.min((log?.step??-1)+1,3);state.reviewLog[x.i]={step,due:Date.now()+[1,7,21,30][step]*86400000};save();smartReview()},a)})}

async function realBank(subject=''){clear();el('h2','Banco de questões Quadrix');state.realAnswers=state.realAnswers||{};state.realNotes=state.realNotes||{};let data=[];try{let r=await fetch('/questoes-reais.json');if(r.ok){let more=await r.json();data=[...new Map([...data,...more].map(q=>[q.id,q])).values()]}}catch{}data=data.filter(q=>q.verified===true&&q.board==='Quadrix'&&q.proofUrl&&q.keyUrl&&q.booklet&&q.number&&q.contextReviewed===true&&typeof q.answer==='boolean'&&q.year>=2013);el('p','Somente questões com prova, caderno, texto associado e gabarito conferidos.');if(!data.length)el('p','Nenhuma questão oficialmente conferida disponível. O catálogo de provas permanece na aba Acervo nacional.');let filters=el('article','');let search=el('input','',filters);search.placeholder='Disciplina, assunto, órgão ou ano';search.value=typeof subject==='string'?subject:'';let select=el('select','',filters);for(let t of ['Todas','Não resolvidas','Acertei','Errei'])el('option',t,select);let list=el('section','');function draw(){list.replaceChildren();let qs=data.filter(q=>[q.subject,q.topic,q.org,q.year,q.statement].join(' ').toLowerCase().includes(search.value.toLowerCase())).filter(q=>{let a=state.realAnswers[q.id];return select.value==='Todas'||select.value==='Não resolvidas'&&!a||select.value==='Acertei'&&a?.correct||select.value==='Errei'&&a&&!a.correct});el('p',qs.length+' questões disponíveis',list);for(let q of qs){let a=el('article','',list);a.className='official-question';el('div',q.subject+' › '+q.topic,a).className='question-heading';el('small','Ano: '+q.year+' | Banca: Quadrix | Órgão: '+q.org+' | Cargo: '+q.role,a);el('hr','',a);let d=el('details','',a);el('summary','Texto associado +',d);el('p',q.context||'Questão sem texto associado, conforme conferência do caderno.',d).style.whiteSpace='pre-wrap';let source=el('a','Conferir caderno original',d);source.href=q.proofUrl;source.target='_blank';source.rel='noopener noreferrer';let key=el('a','Gabarito definitivo',d);key.href=q.keyUrl;key.target='_blank';key.rel='noopener noreferrer';el('p','Caderno: '+q.booklet+' | Questão: '+q.number,d);el('p',q.instruction||'',a);el('p',q.statement,a).className='statement';let old=state.realAnswers[q.id],choice=old?.value,assisted=false;for(let v of [true,false]){let l=el('label','',a);let r=el('input','',l);r.type='radio';r.name=q.id;r.checked=choice===v;r.disabled=!!old;r.onchange=()=>choice=v;l.append(document.createTextNode(v?'Certo':'Errado'))}let b=btn('Responder',()=>{if(choice===undefined||state.realAnswers[q.id])return;state.realAnswers[q.id]={value:choice,correct:choice===q.answer,assisted};save();draw()},a);b.className='primary';b.disabled=!!old;if(old)el('strong',(old.correct?' Acertou!':' Errou!')+' Gabarito: '+(q.answer?'Certo':'Errado'),a);let bar=el('div','',a);bar.className='question-tools';let panel=el('section','',a);btn('Gabarito comentado',()=>{assisted=true;panel.textContent=q.explanation||'Comentário ainda não disponível.'},bar);btn('Macete',()=>{assisted=true;panel.textContent='Identifique a regra e confira a afirmação no texto.'},bar);btn('Anotações',()=>{panel.replaceChildren();let n=el('textarea','',panel);n.value=state.realNotes[q.id]||'';n.oninput=()=>{state.realNotes[q.id]=n.value;save()}},bar);let y=el('a','Videoaulas',bar);y.href='https://www.youtube.com/results?search_query='+encodeURIComponent('Quadrix '+q.subject+' '+q.topic);y.target='_blank';y.rel='noopener noreferrer';y.onclick=()=>assisted=true;el('small',q.source||'Fonte pendente',a)}}search.oninput=draw;select.onchange=draw;draw()}
async function archive(){clear();el('h2','Acervo nacional Quadrix');el('p','Catálogo de documentos oficiais. Questões e gabaritos ainda precisam de pareamento individual antes de entrar nos simulados.');try{let d=await fetch('/acervo.json').then(r=>r.json());el('p','Última execução: '+(d.lastRun||'Ainda não executado')+' | Documentos: '+d.documents.length+' | Falhas: '+d.failures.length);for(let x of d.documents){let a=el('article','');el('p',x.title+' — '+x.status,a);let l=el('a','Abrir documento',a);l.href=x.url;l.target='_blank';l.rel='noopener noreferrer'}for(let u of d.seeds){let l=el('a',u);l.href=u;el('p','')}}catch(e){el('p','Não foi possível carregar o catálogo.')}}
function officialExamNotice(){clear();el('h2','Simulados oficiais Quadrix');el('p','A geração de simulados com questões autorais foi suspensa. A montagem automática com questões originais depende da importação e conferência do acervo.');btn('Consultar questões oficiais',()=>realBank())}function menu(items){nav.replaceChildren();for(let [t,f] of items){let b=btn(t,()=>{nav.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');f();window.scrollTo(0,0)},nav)}}function catalog(){menu([['Meus concursos',catalog],['Radar de concursos',radarPage],['Acervo nacional',archive]]);clear();let hero=el('section','');hero.className='hero';el('h2','Qual concurso você vai estudar?',hero);el('p','Escolha sua preparação e acesse as disciplinas em um ambiente dedicado.',hero);let search=el('input','');search.placeholder='Pesquisar concurso ou cargo';let grid=el('section','');grid.className='course-grid';function draw(){grid.replaceChildren();if('seedf secretaria educação monitor gestão educacional quadrix'.includes(search.value.toLowerCase().trim())){let a=el('article','',grid);el('small','PREPARAÇÃO PRIORITÁRIA',a);el('h3','SEEDF — Monitor',a);el('p','Distrito Federal • Foco Quadrix',a);el('p',rows.length+' etapas importadas • '+lessons.length+' aulas disponíveis',a);let b=btn('Acessar meu curso',openCourse,a);b.className='primary'}for(let x of radar.items.filter(x=>!x.name.includes('SEEDF')&&x.name.toLowerCase().includes(search.value.toLowerCase().trim()))){let a=el('article','',grid);el('small','RADAR • CURSO NÃO DISPONÍVEL',a);el('h3',x.name,a);el('p',x.status,a);el('p','Banca: '+x.board,a);btn('Ver informações',radarPage,a)}}search.oninput=draw;draw()}function radarPage(){clear();el('h2','Radar de concursos');el('p','Levantamento de '+radar.date+' — informações e distâncias a confirmar.');let grid=el('section','');grid.className='course-grid';for(let x of radar.items){let a=el('article','',grid);el('h3',x.name,a);el('p',x.status,a);el('p','Banca: '+x.board+' | Vagas: '+x.vacancies,a);el('p','Salário: '+x.salary,a);let l=el('a','Conferir fonte',a);l.href=x.url;l.target='_blank';l.rel='noopener noreferrer'}}function openCourse(){menu([['← Meus concursos',catalog],['Visão geral',courseHome],['Disciplinas',disciplinePage],['Roteiro completo',roadmap],['Questões Quadrix',realBank],['Simulados de sábado',officialExamNotice],['Revisão inteligente',smartReview],['Caderno de erros',errors],['Revisões programadas',reviews],['Flashcards',flash],['Redação',writing]]);courseHome()}function courseHome(){clear();let hero=el('section','');hero.className='hero';el('small','MEU CURSO',hero);el('h2','SEEDF — Monitor de Gestão Educacional',hero);el('p','Aprenda fazendo • Meta acima de 90% sem consulta',hero);let m=el('section','');m.className='metrics';let solo=Object.values(state.realAnswers||{}).filter(x=>!x.assisted);for(let [label,value] of [['Aproveitamento',solo.length?(100*solo.filter(x=>x.correct).length/solo.length).toFixed(1)+'%':'Sem dados'],['Etapas concluídas',Object.keys(state.done).length+'/'+rows.length],['Questões respondidas',Object.keys(state.realAnswers||{}).length]]){let a=el('article','',m);el('small',label,a);el('strong',value,a).className='metric'}let a=el('article','');el('h3','Continue seus estudos',a);let p=el('progress','',a);p.max=rows.length||1;p.value=Object.keys(state.done).length;btn('Escolher disciplina',disciplinePage,a).className='primary';btn('Revisar dificuldades',smartReview,a);btn('Simulado semanal',officialExamNotice,a);el('p','Curso em construção: roteiro parcial e aulas iniciais. Provas oficiais ainda não integradas ao banco interativo.')}function disciplinePage(){clear();el('h2','Disciplinas do curso');let grid=el('section','');grid.className='course-grid';for(let s of [...new Set([...subjects,...lessons.map(l=>l[0])])]){let a=el('article','',grid);el('h3',s,a);let matching=lessons.map((l,i)=>({l,i})).filter(x=>x.l[0]===s);let rr=rows.filter(r=>r.subject===s);el('p',rr.length+' etapas do roteiro • '+matching.length+' aulas disponíveis',a);for(let x of matching)btn(x.l[1],()=>study(x.i),a);if(!matching.length)el('small','Aulas interativas ainda não disponíveis.',a);if(rr.length){let d=el('details','',a);el('summary','Ver conteúdo programático',d);for(let r of rr)el('p',r.id+' — '+r.title,d)}}}catalog();
</script></html>
